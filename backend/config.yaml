# ColdTrack AI backend configuration
# Synchronous FastAPI service — no database, no background jobs.

app:
  name: coldtrack-ai-backend
  host: 0.0.0.0
  port: 8000
  mock_mode: false

model:
  onnx_path: models/coldtrack.onnx
  labels_path: models/labels.json
  version: coldtrack-gru-v2-fusion-v4

cargo_profiles:
  vaksin_2_8C:
    name: "Vaksin & Produk Biologis (2 - 8°C)"
    min_temp_c: 2.0
    max_temp_c: 8.0
    critical_temp_c: 10.0
  daging_beku_-18C:
    name: "Daging & Makanan Beku (-18°C)"
    min_temp_c: -22.0
    max_temp_c: -18.0
    critical_temp_c: -12.0
  buah_segar_4_10C:
    name: "Buah & Sayur Segar (4 - 10°C)"
    min_temp_c: 4.0
    max_temp_c: 10.0
    critical_temp_c: 15.0

risk_weights:
  temp_breach: 0.40
  temp_rate_of_rise: 0.25
  reefer_off: 0.20
  door_open: 0.15

