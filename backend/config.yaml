# ColdTrack AI backend configuration
# Synchronous FastAPI service — no database, no background jobs.

app:
  name: coldtrack-ai-backend
  host: 0.0.0.0
  port: 8000
  mock_mode: false

model:
  # Sumber forecast + failure_mode. Status AMAN/WASPADA/KRITIS selalu dari mesin fisika (app/core/engine.py).
  #   v3          (default sejak 2026-10-11, lulus G3) GRU 3x128, 7 kelas kegagalan
  #   checkpoint2 model sebelumnya (3 kejadian). ROLLBACK: ganti nilai di bawah ke checkpoint2, restart backend.
  diagnosis_provider: v3
  providers:
    v3:
      gru_onnx_path: models/coldtrack_v3.onnx            # = ml/reports/coldtrack_b3.onnx
      ttb_onnx_path: models/coldtrack_ttb_window.onnx    # = ml/reports/coldtrack_ttb.onnx (XGBoost, kontrak jendela)
      labels_path: models/coldtrack_v3.labels.json       # urutan kelas + keterbatasan
      version: coldtrack-hybrid-v3-gru-b3
    checkpoint2:
      gru_onnx_path: models/coldtrack_gru.onnx
      ttb_onnx_path: models/coldtrack_ttb.onnx
      version: coldtrack-hybrid-v3
# Ambang status dan batas tampil TTB ada di app/core/engine.py :: CFG.

fleet:
  # [ASUMSI] harga muatan per kg (IDR) untuk estimasi kerugian; BUKAN harga pasar resmi.
  # Alasan dan sumber: docs/fleet_assumptions.md. Ganti dengan nilai dari mitra saat pilot.
  harga_per_kg_idr:
    vaksin_2_8C: 2500000
    daging_beku_-18C: 140000
    buah_segar_2_4C: 30000
    ikan_segar_0_5C: 60000
    produk_susu_2_4C: 25000
  history_cap_min: 240          # riwayat maksimum per truk untuk engine (menit)
  ffill_maks_menit: 5           # celah <= ini diisi nilai terakhir; lebih besar -> DATA_TIDAK_LENGKAP
  offline_setelah_menit: 10     # tanpa bacaan selama ini -> TIDAK_ADA_DATA (tidak pernah AMAN)

# c_kj_kgc dan mass_kg_default = [ASUMSI] sampai diganti nilai dari `data kalor.pdf`
# (segar ~3,6-3,9 kJ/kg.C, beku ~1,8). mass_kg_default dipakai bila request tidak
# mengirim mass_kg; muatan kecil -> alarm lebih sensitif.
cargo_profiles:
  vaksin_2_8C:
    name: "Vaksin & Produk Biologis (2 - 8°C)"
    min_temp_c: 2.0
    max_temp_c: 8.0
    critical_temp_c: 10.0
    c_kj_kgc: 3.8
    mass_kg_default: 1000
  daging_beku_-18C:
    name: "Daging & Makanan Beku (-25 – -18°C)"
    min_temp_c: -25.0
    max_temp_c: -18.0
    critical_temp_c: -12.0
    c_kj_kgc: 1.8
    t_set_c: -20.0          # titik setel freezer Isuzu (sama dengan simulator)
    mass_kg_default: 1000
  buah_segar_2_4C:
    name: "Buah & Sayur Segar (2 - 4°C)"
    min_temp_c: 2.0
    max_temp_c: 4.0
    critical_temp_c: 6.0
    c_kj_kgc: 3.9
    mass_kg_default: 1000
  ikan_segar_0_5C:
    name: "Ikan Segar (0 - 5°C)"
    min_temp_c: 0.0
    max_temp_c: 5.0
    critical_temp_c: 8.0
    c_kj_kgc: 3.6
    mass_kg_default: 1000
  produk_susu_2_4C:
    name: "Produk Susu (2 - 4°C)"
    min_temp_c: 2.0
    max_temp_c: 4.0
    critical_temp_c: 6.0
    c_kj_kgc: 3.9
    mass_kg_default: 1000
