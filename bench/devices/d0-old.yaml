# Profil device lama (pembanding "sebelum vs sesudah"). TEMPLATE -- diisi user di device itu.
#
# GPU Radeon terintegrasi tidak mendukung CUDA, jadi d0-old hanya menjalankan jalur CPU
# (PyTorch CPU, XGBoost hist CPU, ONNX Runtime CPU). Variasi khusus GPU (AMP, CUDA EP)
# dicatat "tidak berlaku", bukan dikosongkan.
#
# Spesifikasi terukur diambil otomatis oleh bench/env_capture.py saat dijalankan di sana.

device: d0-old
deskripsi: Lenovo Yoga 6

# Info dari user (2026-10-10), bukan hasil ukur
dari_user:
  cpu: AMD Ryzen 7 5700U
  gpu: AMD Radeon (terintegrasi, tidak dipakai untuk komputasi)
  ram: 16 GB
  os: null                 # belum diketahui -- dicatat otomatis oleh env_capture

tags:
  d0-old: {device: cpu}

# Usahakan setara dengan G16 (WSL2 Ubuntu). Bila memakai Windows native, tulis di sini:
# batas memorinya berbeda dan itu harus disebut di laporan.
lingkungan: WSL2 Ubuntu 24.04

# Diisi 2026-10-11 dari pengecekan otomatis di laptop ini (run dijalankan oleh Claude Code)
kondisi:
  charger: true            # Win32_Battery BatteryStatus=2 (AC) saat run dimulai
  mode_daya: Lenovo Extreme Performance (Fn+Q) + Windows "Best performance"   # LITSSVC MMC CurrentSetting=3; overlay ded574b5
  pendingin: meja keras tanpa cooling pad   # dari user
  aplikasi_berat_ditutup: true   # iCloudPhotos, OneDrive, ChatGPT, Creative Cloud ditutup sebelum run
  wslconfig_memory: 12GB
  catatan: >-
    Run pertama (mode Lenovo otomatis/Intelligent Cooling) dibatalkan: suhu CPU mencapai ~100 C lalu
    di-clamp ke ~22% performa (~400 MHz) selama 4-8 menit, berulang tiap ~10 menit. Hasilnya tidak
    dipakai. Claude Code desktop tetap berjalan sebagai pengendali run (beban CPU ~1-2%), ditambah
    perekam suhu/performa Windows tiap ~12 detik.
