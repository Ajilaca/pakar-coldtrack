version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coldtrack-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: coldtrack-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Di sini `environment` memang benar: Dockerfile.dev menjalankan
      # `next dev`, yang membaca variabel saat proses start — bukan saat
      # image dibangun seperti pada compose produksi.
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_USE_MOCK=false
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    restart: unless-stopped
